# Local testing only: Postgres + MinIO for Feedback Pulse.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    # The spec asks for minio/minio, but that image is no longer pullable from Docker Hub;
    # pgsty/minio is a drop-in community build with the same entrypoint and flags.
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      # Console listens on 9001 in the container; host 9001 is already taken in the
      # DKubeX workspace, so it is published on 9091.
      - "9091:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
