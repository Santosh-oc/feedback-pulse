apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feedback-pulse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "feedback-pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgres.db_url | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.access_key | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secret_key | quote }}
  LLM_TOKEN: {{ .Values.llm.token | quote }}
